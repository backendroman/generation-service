x-image: &image
  build: .
  image: generation-service:dev

x-common-env: &common-env
  DATABASE_URL: postgresql://app:app@db:5432/app
  WEBHOOK_SECRET: dev-secret

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *image
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *common-env
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *image
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    environment:
      <<: *common-env
      PROVIDER_TIMEOUT: "60"
      PROVIDER_HTTP_TIMEOUT: "5"
      WATCHDOG_INTERVAL: "1"
      DISPATCH_LEASE: "30"
      ALPHA_URL: http://alpha:8001
      BETA_URL: http://beta:8002
      PUBLIC_BASE_URL: http://app:8000
      MAX_ACTIVE_TASKS: "3"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      alpha:
        condition: service_started
      beta:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  tests:
    <<: *image
    profiles: ["test"]
    command: ["pytest", "-v"]
    environment:
      <<: *common-env
      APP_URL: http://app:8000
      ALPHA_URL: http://alpha:8001
      BETA_URL: http://beta:8002
      PROVIDER_TIMEOUT: "60"
    depends_on:
      app:
        condition: service_healthy

  alpha:
    <<: *image
    command: ["uvicorn", "providers.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      PROVIDER_NAME: alpha
      WEBHOOK_SECRET: dev-secret
    ports:
      - "8001:8001"

  beta:
    <<: *image
    command: ["uvicorn", "providers.main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      PROVIDER_NAME: beta
      WEBHOOK_SECRET: dev-secret
    ports:
      - "8002:8002"
